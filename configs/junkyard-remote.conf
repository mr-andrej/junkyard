# JUNKyard Syslog Configuration for Source VMs
# Place this file on each VM that needs to forward logs to S2-MT
#
# Installation:
#   sudo cp junkyard-remote.conf /etc/rsyslog.d/99-junkyard.conf
#   sudo systemctl restart rsyslog
#
# Replace JUNKYARD_IP with the actual IP address of S2-MT (e.g., 192.168.20.5)

# Forward all logs to JUNKyard on S2-MT
# Using TCP @@hostname format for reliable delivery
*.* @@JUNKYARD_IP:5514

# Optional: Buffer logs if connection fails (requires rsyslog-imfile)
# $ActionQueueFileName junkyard
# $ActionQueueMaxDiskSpace 1g
# $ActionQueueSaveOnShutdown on
# $ActionQueueType LinkedList
# $ActionResumeRetryCount -1

# Optional: Add metadata to remote logs
# $ActionForwardDefaultTemplate RSYSLOG_FileFormat
# $Template junkyard_format,"%HOSTNAME% %syslogtag%%msg%\n"
# *.* @@JUNKYARD_IP:5514;junkyard_format
